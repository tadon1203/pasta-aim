[package]
name = "nice-aimassist"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]

[target.'cfg(windows)'.dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = true }
global-hotkey = "0.8.0"
ort = { version = "=2.0.0-rc.13", features = ["directml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
win_desktop_duplication = "0.10.11"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_XboxController"] }
makxd = { path = "vendor/makxd" }
