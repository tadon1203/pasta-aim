[package]
name = "nice-aimassist"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "nice-aimassist"
path = "src/bin/app/main.rs"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
global-hotkey = "0.8.0"
half = "2.7"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "half", "api-27", "download-binaries", "tls-native", "copy-dylibs", "directml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.57.0", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_AI_MachineLearning_DirectML",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints.rust]
missing_debug_implementations = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"
rc_buffer = "warn"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
borrow_as_ptr = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
