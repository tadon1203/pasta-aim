[package]
name = "nice-aimassist"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]

[target.'cfg(windows)'.dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
global-hotkey = "0.8.0"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-27", "download-binaries", "tls-native", "copy-dylibs", "directml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.57.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse"] }
makxd = { path = "vendor/makxd" }
